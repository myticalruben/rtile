[workspace]
resolver = "2"
members = ["crates/rtile-core", "crates/rtile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Ruben Alexander"]
repository = "https://github.com/myticalruben/rtile"

[workspace.dependencies]
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
